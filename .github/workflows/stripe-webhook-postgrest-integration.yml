name: Stripe webhook local PostgREST integration

on:
  push:
    branches:
      - feat/stripe-webhook-atomic-claim-candidate
  pull_request:
    paths:
      - "docs/proposals/stripe-webhook-atomic-claim-candidate.sql"
      - "supabase/functions/stripe-webhook/**"
      - "tests/fixtures/stripe-webhook-postgres-fixture.sql"
      - "tests/stripe-webhook-postgres.sh"
      - "tests/stripe-webhook-postgrest.integration.mjs"
      - ".github/workflows/stripe-webhook-postgrest-integration.yml"

jobs:
  postgrest-rpc-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reputix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reputix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reputix_test
      POSTGREST_URL: http://127.0.0.1:3000
      POSTGREST_JWT_SECRET: reputix-postgrest-integration-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client and pinned Stripe SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npm install --no-save stripe@23.1.0
      - name: Show disposable PostgreSQL version
        run: psql "$DATABASE_URL" -X -A -t -c "select version()"
      - name: Apply disposable fixture and candidate SQL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f tests/fixtures/stripe-webhook-postgres-fixture.sql \
            -f docs/proposals/stripe-webhook-atomic-claim-candidate.sql
      - name: Start local PostgREST container
        run: |
          docker run -d --name reputix-postgrest \
            --add-host=host.docker.internal:host-gateway \
            -p 3000:3000 \
            -e PGRST_DB_URI="postgres://postgres:postgres@host.docker.internal:5432/reputix_test" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$POSTGREST_JWT_SECRET" \
            postgrest/postgrest:v12.2.3
          for i in {1..40}; do
            if curl -fsS "$POSTGREST_URL/" > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs reputix-postgrest
          exit 1
      - name: Exercise Edge Function handler against real local PostgREST RPC
        run: node --test tests/stripe-webhook-postgrest.integration.mjs
