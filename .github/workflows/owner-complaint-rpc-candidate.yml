name: Owner complaint RPC security candidate tests

on:
  pull_request:
    paths:
      - "docs/proposals/owner-complaint-rpc-hardening.sql"
      - "tests/owner-complaint-rpc.sh"
      - "tests/fixtures/owner-complaint-rpc-fixture.sql"
      - ".github/workflows/owner-complaint-rpc-candidate.yml"

jobs:
  owner-authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reputix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reputix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reputix_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run isolated owner authorization tests
        run: bash tests/owner-complaint-rpc.sh
