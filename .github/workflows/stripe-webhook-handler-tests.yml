name: Stripe webhook handler contract tests

on:
  pull_request:
    paths:
      - "supabase/functions/stripe-webhook/**"
      - "tests/stripe-webhook-handler.test.mjs"
      - ".github/workflows/stripe-webhook-handler-tests.yml"

jobs:
  handler-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
      - name: Type-check the Deno Edge Function adapter
        run: deno check supabase/functions/stripe-webhook/index.ts
      - name: Run isolated webhook handler contract tests
        run: node --test tests/stripe-webhook-handler.test.mjs
