name: Reputix Browser QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/reputix-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/reputix-http.log
          exit 1
      - name: Test approved-only static profile generation
        run: node --test tests/prerender-approved-profiles.test.cjs tests/fetch-approved-businesses.test.cjs tests/sync-generated-profiles.test.cjs
      - name: Run browser smoke tests
        run: node tests/smoke.spec.cjs

  postgrest-rpc-integration:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/stripe-webhook-atomic-claim-candidate'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reputix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reputix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reputix_test
      POSTGREST_URL: http://127.0.0.1:3000
      POSTGREST_JWT_SECRET: reputix-postgrest-integration-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client and pinned Stripe SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          npm install --no-save stripe@23.1.0
      - name: Apply disposable fixture and candidate SQL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f tests/fixtures/stripe-webhook-postgres-fixture.sql \
            -f docs/proposals/stripe-webhook-atomic-claim-candidate.sql
      - name: Start local PostgREST container
        run: |
          docker run -d --name reputix-postgrest \
            --add-host=host.docker.internal:host-gateway \
            -p 3000:3000 \
            -e PGRST_DB_URI="postgres://postgres:postgres@host.docker.internal:5432/reputix_test" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$POSTGREST_JWT_SECRET" \
            postgrest/postgrest:v12.2.3
          for i in {1..40}; do
            if curl -fsS "$POSTGREST_URL/" > /dev/null; then exit 0; fi
            sleep 1
          done
          docker logs reputix-postgrest
          exit 1
      - name: Exercise handler against local PostgREST RPC
        run: node --test tests/stripe-webhook-postgrest.integration.mjs
      - name: Stop local PostgREST container
        if: always()
        run: docker rm -f reputix-postgrest || true
