name: Reputix Browser QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test AI agent GitHub context safety contract
        run: node --test tests/agent-github-context-contract.test.cjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/reputix-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/reputix-http.log
          exit 1
      - name: Test approved-only static profile generation
        run: node --test tests/prerender-approved-profiles.test.cjs tests/fetch-approved-businesses.test.cjs tests/sync-generated-profiles.test.cjs
      - name: Run browser smoke tests
        run: node tests/smoke.spec.cjs
      - name: Upload design review screenshots
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: reputix-design-preview
          path: artifacts/reputix-preview/*.png
          if-no-files-found: error
          retention-days: 7
