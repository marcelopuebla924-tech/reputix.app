name: Reputix Browser QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test AI agent GitHub context safety contract
        run: node --test tests/agent-github-context-contract.test.cjs
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 > /tmp/reputix-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/reputix-http.log
          exit 1
      - name: Test approved-only static profile generation
        run: node --test tests/prerender-approved-profiles.test.cjs tests/fetch-approved-businesses.test.cjs tests/sync-generated-profiles.test.cjs
      - name: Run browser smoke tests
        run: node tests/smoke.spec.cjs
      - name: Capture design review screenshots
        if: success()
        run: |
          mkdir -p artifacts/reputix-preview
          node <<'NODE'
          const { chromium } = require("playwright");
          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              const desktop = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
              await desktop.goto("http://127.0.0.1:4173/", { waitUntil: "networkidle" });
              await desktop.screenshot({ path: "artifacts/reputix-preview/desktop-es.png", fullPage: true });
              await desktop.locator("#language").selectOption("en");
              await desktop.screenshot({ path: "artifacts/reputix-preview/desktop-en.png", fullPage: true });
              const mobile = await browser.newPage({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
              await mobile.goto("http://127.0.0.1:4173/", { waitUntil: "networkidle" });
              await mobile.screenshot({ path: "artifacts/reputix-preview/mobile-es.png", fullPage: true });
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload design review screenshots
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: reputix-design-preview
          path: artifacts/reputix-preview/*.png
          if-no-files-found: error
          retention-days: 7
