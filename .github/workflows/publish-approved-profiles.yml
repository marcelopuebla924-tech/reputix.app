name: Prepare approved public business profiles

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - app.js
      - index.html
      - scripts/fetch-approved-businesses.cjs
      - scripts/prerender-approved-profiles.cjs
      - scripts/sync-generated-profiles.cjs
      - .github/workflows/publish-approved-profiles.yml

permissions:
  contents: write

concurrency:
  group: reputix-approved-profile-publishing
  cancel-in-progress: false

jobs:
  prepare-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test approved-profile publishing safeguards
        run: node --test tests/prerender-approved-profiles.test.cjs tests/fetch-approved-businesses.test.cjs tests/sync-generated-profiles.test.cjs

      - name: Fetch approved public business fields with the publishable key
        run: node scripts/fetch-approved-businesses.cjs /tmp/reputix-approved-businesses.json

      - name: Generate static profiles and approved-only sitemap
        run: node scripts/prerender-approved-profiles.cjs /tmp/reputix-approved-businesses.json .reputix-generated index.html

      - name: Safely sync generated pages into the publishing branch
        run: |
          node scripts/sync-generated-profiles.cjs .reputix-generated .
          rm -rf .reputix-generated /tmp/reputix-approved-businesses.json

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Start local site for browser QA
        run: |
          python3 -m http.server 4173 > /tmp/reputix-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/reputix-http.log
          exit 1

      - name: Run browser regression suite before pushing the candidate branch
        run: node tests/smoke.spec.cjs

      - name: Push approved-profile candidate branch for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B automation/approved-public-profiles
          git add -- business sitemap.xml
          if git diff --cached --quiet; then
            echo "No approved-profile or sitemap changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh approved public business profiles"
          git push --force origin automation/approved-public-profiles
